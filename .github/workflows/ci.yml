name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The job keeps the name "test", the status check the main branch's ruleset requires.
  test:
    runs-on: ubuntu-latest
    env:
      # The build and tests never start Electron, so its binary is not downloaded.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
